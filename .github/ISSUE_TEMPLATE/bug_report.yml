name: Bug report
description: Something in hYYa ink isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: hYYa ink version
      description: Shown on hYYa ink's page in the App Store or Google Play
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, iPad, iPhone, Android]
    validations: { required: true }
  - type: input
    id: format
    attributes:
      label: File format involved
      description: e.g. PDF, Markdown, JSON, CSV
